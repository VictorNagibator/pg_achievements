# Build the demo image (see Dockerfile) for every supported PostgreSQL
# version, start it and check that achievements work.  A release tag also
# publishes the images to the GitHub Container Registry:
#   ghcr.io/<owner>/pg_achievements:latest        PostgreSQL 18, latest release
#   ghcr.io/<owner>/pg_achievements:pg17          given PostgreSQL, latest release
#   ghcr.io/<owner>/pg_achievements:1.2.0-pg17    given release and PostgreSQL
name: Docker

on:
  push:
  pull_request:

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17, 18, 19]
    name: Image for PostgreSQL ${{ matrix.pg }}
    env:
      LATEST_PG: 18   # the main development version, as in the Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build --build-arg PG_MAJOR=${{ matrix.pg }} -t pga:test .

      - name: Smoke test
        run: |
          docker run -d --name pga -e POSTGRES_PASSWORD=secret pga:test
          # the entrypoint runs the init scripts on a temporary server, then
          # restarts it: wait for the real one
          for i in $(seq 1 60); do
            if docker logs pga 2>&1 | grep -q 'init process complete' &&
               docker exec pga pg_isready -U postgres -q; then
              break
            fi
            sleep 1
          done
          docker exec pga psql -U postgres -v ON_ERROR_STOP=1 \
            -c 'SELECT achievements.version()' \
            -c 'SELECT achievements.sync(30000)' \
            -c 'CREATE TABLE smoke (id int)' 2>&1 | tee out.txt
          grep -q 'Achievement unlocked: First Table' out.txt

      - name: Logs
        if: failure()
        run: docker logs pga

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pg_achievements
          version=${GITHUB_REF_NAME#v}
          tags="$version-pg${{ matrix.pg }} pg${{ matrix.pg }}"
          if [ "${{ matrix.pg }}" = "$LATEST_PG" ]; then
            tags="$tags $version latest"
          fi
          for tag in $tags; do
            docker tag pga:test "$image:$tag"
            docker push "$image:$tag"
          done
